[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4gh2studio"
version = "0.4.0"
description = "Draw GA4GH Pedigree and Phenopackets Family files in Pedigree Studio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
]
keywords = ["pedigree", "ga4gh", "phenopackets", "genetics", "clinical-genetics", "interoperability"]
authors = [
    {name = "Tim Hearn", email = "tjh70@cam.ac.uk"},
]
dependencies = ["pedigree-ga4gh>=1.0,<2"]

[project.optional-dependencies]
# studio2ga4gh is needed only by the round-trip test, which draws each file and converts it back
test = ["pytest>=7", "studio2ga4gh>=0.4"]

[project.scripts]
ga4gh2studio = "ga4gh2studio.cli:main"

[project.urls]
Homepage = "https://github.com/comparativechrono/ga4gh2studio"
Issues = "https://github.com/comparativechrono/ga4gh2studio/issues"
Changelog = "https://github.com/comparativechrono/ga4gh2studio/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ga4gh2studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
