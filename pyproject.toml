[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4gh2studio"
version = "0.3.0"
description = "Convert GA4GH Pedigree Standard and Phenopackets to Pedigree Studio session JSON"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["pedigree", "ga4gh", "phenopackets", "genetics", "clinical-genetics", "pedigree-studio"]
authors = [
    {name = "Tim Hearn", email = "tjh70@cam.ac.uk"},
]

[project.scripts]
ga4gh2studio = "ga4gh2studio.cli:main"

[project.urls]
Homepage = "https://github.com/comparativechrono/ga4gh2studio"
Issues = "https://github.com/comparativechrono/ga4gh2studio/issues"

[tool.setuptools.packages.find]
include = ["ga4gh2studio*"]
